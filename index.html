<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tasbih Pro</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07231c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg-dark: #07231c;
      --panel-tint: #0d382e;
      --surface-dial: #061e18;
      --accent-neon: #25e26b;
      --accent-glow: rgba(37, 226, 107, 0.45);
      --accent-subtle: rgba(37, 226, 107, 0.15);
      --text-muted: #7fa89d;
      --counter-font: system-ui, -apple-system, sans-serif;
    }

    body.theme-emerald { --bg-dark: #07231c; --panel-tint: #0d382e; --surface-dial: #061e18; --accent-neon: #25e26b; --accent-glow: rgba(37,226,107,0.45); --accent-subtle: rgba(37,226,107,0.15); --text-muted: #7fa89d; }
    body.theme-amber { --bg-dark: #231b0c; --panel-tint: #382c14; --surface-dial: #1a1408; --accent-neon: #ffb703; --accent-glow: rgba(255,183,3,0.45); --accent-subtle: rgba(255,183,3,0.15); --text-muted: #bfa77a; }
    body.theme-ocean { --bg-dark: #0a1b2a; --panel-tint: #112d45; --surface-dial: #06121c; --accent-neon: #00b4d8; --accent-glow: rgba(0,180,216,0.45); --accent-subtle: rgba(0,180,216,0.15); --text-muted: #7ba2c2; }
    body.theme-ruby { --bg-dark: #240c11; --panel-tint: #3d141d; --surface-dial: #19080b; --accent-neon: #ff3366; --accent-glow: rgba(255,51,102,0.45); --accent-subtle: rgba(255,51,102,0.15); --text-muted: #b87b87; }
    body.theme-purple { --bg-dark: #190c26; --panel-tint: #2c1442; --surface-dial: #11071a; --accent-neon: #c77dff; --accent-glow: rgba(199,125,255,0.45); --accent-subtle: rgba(199,125,255,0.15); --text-muted: #9e84b8; }
    body.theme-forest { --bg-dark: #092612; --panel-tint: #11381b; --surface-dial: #051a0b; --accent-neon: #4ade80; --accent-glow: rgba(74,222,128,0.45); --accent-subtle: rgba(74,222,128,0.15); --text-muted: #82ab8b; }
    body.theme-cyanteal { --bg-dark: #062426; --panel-tint: #0d383b; --surface-dial: #04191a; --accent-neon: #00f5d4; --accent-glow: rgba(0,245,212,0.45); --accent-subtle: rgba(0,245,212,0.15); --text-muted: #76a8a7; }
    body.theme-rosegold { --bg-dark: #28141e; --panel-tint: #3d1e2e; --surface-dial: #1a0b12; --accent-neon: #fb7185; --accent-glow: rgba(251,113,133,0.45); --accent-subtle: rgba(251,113,133,0.15); --text-muted: #be8e9d; }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #020b08; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .mobile-frame { width: 100%; max-width: 412px; height: 100vh; max-height: 890px; background-color: var(--bg-dark); display: flex; flex-direction: column; justify-content: space-between; padding: 16px 18px 22px 18px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.9); overflow: hidden; transition: background-color 0.25s ease; cursor: pointer; }
    .mobile-frame::before { content: ""; position: absolute; inset: 0; opacity: 0.12; pointer-events: none; background-image: radial-gradient(circle at 50% 0%, var(--accent-neon) 1.5px, transparent 2.5px), linear-gradient(to right, rgba(255,255,255,0.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.12) 1px, transparent 1px); background-size: 36px 36px; }
    .no-screen-tap { cursor: default; }

    .top-bar { display: flex; align-items: center; justify-content: space-between; z-index: 5; }
    .icon-btn { background: none; border: none; color: var(--text-muted); padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .icon-btn:active { transform: scale(0.9); color: #ffffff; }
    .stopwatch-pill { background: var(--panel-tint); border-radius: 26px; padding: 6px 16px; display: flex; align-items: center; gap: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); }
    .sw-time { font-family: monospace; font-size: 15px; font-weight: 700; letter-spacing: 1px; }

    .header-content { text-align: center; margin-top: 4px; z-index: 5; }
    .tasbih-heading { font-size: 26px; font-weight: 700; color: #ffffff; }
    .target-badge { display: inline-block; background: rgba(0,0,0,0.3); padding: 2px 10px; border-radius: 16px; font-size: 11px; color: var(--text-muted); margin-top: 4px; border: 1px solid rgba(255,255,255,0.06); }
    .target-badge strong { color: var(--accent-neon); }

    .quick-actions { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 12px; }
    .auto-badge { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-subtle); border: 1.5px solid var(--accent-neon); color: var(--accent-neon); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .tool-btn { color: var(--text-muted); cursor: pointer; background: none; border: none; display: flex; padding: 4px; }
    .tool-btn.active { color: var(--accent-neon); }

    .center-stage { display: flex; align-items: center; justify-content: center; flex: 1; position: relative; z-index: 5; pointer-events: none; }
    .dial-touch-zone { width: 290px; height: 290px; border-radius: 50%; background: radial-gradient(circle at 45% 45%, var(--panel-tint) 0%, var(--surface-dial) 100%); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 45px rgba(0,0,0,0.75), inset 0 3px 6px rgba(255,255,255,0.08), inset 0 -6px 14px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.06); transition: transform 0.08s ease; }
    .dial-touch-zone.pressed { transform: scale(0.96); }
    .dial-notch { position: absolute; top: 10px; width: 14px; height: 4px; border-radius: 4px; background-color: var(--accent-neon); box-shadow: 0 0 10px var(--accent-neon); }
    .counter-number { font-family: var(--counter-font); font-size: 106px; font-weight: 700; color: transparent; -webkit-text-stroke: 3.5px var(--accent-neon); text-shadow: 0 0 16px var(--accent-glow); line-height: 1; margin-top: 12px; }
    .round-indicator { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

    .bottom-dock { background: var(--panel-tint); border-radius: 36px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); z-index: 5; }
    .dock-btn { background: none; border: none; color: var(--text-muted); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; }
    .dock-btn:active { transform: scale(0.9); color: #fff; }
    .dock-btn.plus-primary { background: var(--accent-neon); color: #051612; box-shadow: 0 0 16px var(--accent-glow); }

    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 30; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: var(--panel-tint); width: 100%; max-width: 325px; border-radius: 22px; padding: 18px 20px 22px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 45px rgba(0,0,0,0.8); }
    .modal-tabs { display: flex; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 3px; margin-bottom: 16px; }
    .modal-tab-btn { flex: 1; padding: 8px 0; border: none; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 14px; border-radius: 9px; cursor: pointer; }
    .modal-tab-btn.active { background: rgba(255,255,255,0.12); color: #ffffff; }
    .modal-title { font-size: 16px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
    .modal-desc { font-size: 12.5px; line-height: 1.4; color: var(--text-muted); margin-bottom: 16px; }

    .touch-calibrate-ring { width: 105px; height: 105px; border-radius: 50%; border: 3.5px solid var(--accent-neon); margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; color: var(--accent-neon); cursor: pointer; }
    .stepper-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px 0 20px 0; }
    .step-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: #ffffff; font-size: 16px; font-weight: 700; cursor: pointer; }
    .step-number { font-size: 28px; font-weight: 700; color: #ffffff; line-height: 1; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: rgba(255,255,255,0.08); color: #ffffff; }
    .btn-start { background: var(--accent-neon); color: #06231b; }

    .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: none; flex-direction: column; justify-content: flex-end; z-index: 40; }
    .sheet-overlay.open { display: flex; }
    .sheet-card { background: var(--panel-tint); border-radius: 26px 26px 0 0; padding: 18px 18px 24px 18px; max-height: 85vh; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-box { aspect-ratio: 1; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); }
    .theme-box-circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: transparent; -webkit-text-stroke: 1.2px; }
    .theme-box-notch { width: 14px; height: 3px; border-radius: 2px; margin-top: 6px; }

    .preset-item { background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left; }
    .preset-arabic { font-size: 18px; color: var(--accent-neon); }

    svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body class="theme-emerald">

  <div class="mobile-frame" id="full-screen-touch-area">
    
    <!-- Top Bar -->
    <div class="top-bar no-screen-tap">
      <button class="icon-btn" id="btn-edit-title">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      </button>

      <div class="stopwatch-pill">
        <button class="icon-btn" id="sw-toggle" style="padding: 0; color: #fff;">
          <svg class="icon" id="sw-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <span class="sw-time" id="sw-display">00:00</span>
        <button class="icon-btn" id="sw-reset" style="padding: 0; color: #8bb1a6;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
      </div>

      <button class="icon-btn" id="btn-open-presets">
        <svg class="icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
      </button>
    </div>

    <!-- Header -->
    <div class="header-content no-screen-tap">
      <h1 class="tasbih-heading" id="tasbih-title">Tasbih</h1>
      <div class="target-badge" id="btn-set-target" style="cursor: pointer;">
        <span>Target: </span><strong id="target-number">33</strong>
        <span id="target-pct">(0%)</span>
      </div>

      <div class="quick-actions">
        <div class="auto-badge" id="btn-auto-modal">A</div>
        <button class="tool-btn active" id="btn-sound">
          <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <button class="tool-btn active" id="btn-vibrate">

        </button>

    </div>

    <!-- Center Stage -->
    <div class="center-stage">
      <div class="dial-touch-zone" id="dial-visual">
        <div class="dial-notch"></div>
        <div class="counter-number" id="counter-val">0</div>

      </div>
    </div>

    <!-- Bottom Dock -->
    <div class="bottom-dock no-screen-tap">
      <button class="dock-btn" id="btn-reset-counter" title="Reset All">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
      <button class="dock-btn" id="btn-minus" title="Minus One">
        <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="dock-btn plus-primary" id="btn-plus" title="Add Count">
        <svg class="icon" viewBox="0 0 24 24" style="stroke-width: 3;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="dock-btn" id="btn-history" title="History">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path></svg>
      </button>
      <button class="dock-btn" id="btn-themes" title="Theme Settings">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>

    <!-- Modal Auto Counter -->
    <div class="modal-overlay no-screen-tap" id="modal-auto">
      <div class="modal-card">
        <div class="modal-tabs">
          <button class="modal-tab-btn active" id="tab-touch">Touch</button>
          <button class="modal-tab-btn" id="tab-timer">Timer</button>
        </div>
        <div id="pane-touch">
          <h3 class="modal-title">Setup Auto Counter</h3>
          <p class="modal-desc">Set your auto count delay by tapping below 3 times with your desired speed</p>
          <div class="touch-calibrate-ring" id="touch-calibrate-circle">0</div>
        </div>
        <div id="pane-timer" style="display: none;">
          <h3 class="modal-title">Setup Auto Counter</h3>
          <p class="modal-desc">Set your auto count delay in seconds</p>
          <div class="stepper-row">
            <button class="step-btn" id="step-minus-2">- -</button>
            <button class="step-btn" id="step-minus">-</button>
            <div style="min-width: 75px;">
              <div class="step-number" id="step-number">1.0</div>
              <span style="font-size: 11px; color: var(--text-muted);">seconds</span>
            </div>
            <button class="step-btn" id="step-plus">+</button>
            <button class="step-btn" id="step-plus-2">++</button>
          </div>
          <div class="modal-btns">
            <button class="modal-btn btn-cancel" id="btn-cancel-auto">Cancel</button>
            <button class="modal-btn btn-start" id="btn-start-auto">Start</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Presets Modal -->
    <div class="modal-overlay no-screen-tap" id="modal-presets">
      <div class="modal-card">
        <h3 class="modal-title">Dhikr પસંદ કરો</h3>
        <p class="modal-desc">ટાર્ગેટ સાથે તૈયાર લિસ્ટ</p>
        <div id="presets-container" style="max-height: 250px; overflow-y: auto;"></div>
        <div class="modal-btns" style="margin-top: 12px;">
          <button class="modal-btn btn-cancel" id="btn-close-presets">બંધ કરો</button>
        </div>
      </div>
    </div>

    <!-- Themes Sheet -->
    <div class="sheet-overlay no-screen-tap" id="sheet-themes">
      <div class="sheet-card">
        <div class="sheet-header">
          <button class="icon-btn" id="btn-close-themes" style="color: #fff;"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>

    <!-- History Sheet -->
    <div class="sheet-overlay no-screen-tap" id="sheet-history">

          <button class="icon-btn" id="btn-close-history" style="color: #fff;"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
          <h2 style="font-size: 18px; font-weight: 700;">Dhikr Records</h2>
          <button class="icon-btn" id="btn-clear-history" style="color: #ff6b6b; font-size: 13px; font-weight: 700;">Clear</button>
        </div>
        <div id="history-container" style="max-height: 55vh; overflow-y: auto;"></div>
      </div>
    </div>

  </div>

  <script>
    let count = 0;
    let target = 33;
    let autoDelay = 1.0;
    let autoTimer = null;
    let swSeconds = 0;
    let swTimer = null;
    let swRunning = false;
    let isSoundOn = true;
    let isVibrationOn = true;
    let historyLogs = [];
    let currentTheme = 'theme-emerald';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 750) {
      if (!isSoundOn) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function doVibrate(ms = 25) {
      if (isVibrationOn && navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    function renderCount() {
      document.getElementById('counter-val').textContent = count;
      document.getElementById('target-number').textContent = target;
      const pct = Math.min(100, Math.round((count % target || (count >= target ? target : 0)) / target * 100));
      document.getElementById('target-pct').textContent = `(${pct}%)`;
      const round = Math.floor(count / target);
      document.getElementById('round-val').textContent = `Round ${round}`;
    }

    function startTimerIfNotRunning() {
      if (!swRunning) {
        swRunning = true;
        document.getElementById('sw-icon').innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        swTimer = setInterval(() => {
          swSeconds++;
          const m = String(Math.floor(swSeconds / 60)).padStart(2, '0');
          const s = String(swSeconds % 60).padStart(2, '0');
          document.getElementById('sw-display').textContent = `${m}:${s}`;
        }, 1000);
      }
    }

    function incrementCount() {
      startTimerIfNotRunning();
      count++;
      renderCount();
      playBeep(750);
      doVibrate(25);
      const dial = document.getElementById('dial-visual');
      dial.classList.add('pressed');
      setTimeout(() => dial.classList.remove('pressed'), 80);
      if (count > 0 && count % target === 0) {
        playBeep(1100);
        doVibrate([50, 80, 100]);
        logHistory();
      }
    }

    function decrementCount() {
      if (count > 0) {
        count--;
        renderCount();
        doVibrate(20);
      }
    }

    document.getElementById('full-screen-touch-area').addEventListener('click', (e) => {
      if (e.target.closest('.no-screen-tap')) return;
      incrementCount();
    });

    function resetStopwatch() {
      clearInterval(swTimer);
      swRunning = false;
      swSeconds = 0;
      document.getElementById('sw-display').textContent = '00:00';
      document.getElementById('sw-icon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
    }

    document.getElementById('sw-toggle').onclick = (e) => {
      e.stopPropagation();
      if (swRunning) {
        clearInterval(swTimer);
        swRunning = false;
        document.getElementById('sw-icon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      } else {
        startTimerIfNotRunning();
      }
    };

    document.getElementById('sw-reset').onclick = (e) => {
      e.stopPropagation();
      resetStopwatch();
    };

    document.getElementById('btn-reset-counter').onclick = (e) => {
      e.stopPropagation();
      if (confirm("Badhu reset karvu che?")) {
        logHistory();
        count = 0;
        renderCount();
        resetStopwatch();
      }
    };

    document.getElementById('btn-plus').onclick = (e) => { e.stopPropagation(); incrementCount(); };
    document.getElementById('btn-minus').onclick = (e) => { e.stopPropagation(); decrementCount(); };

    const btnSound = document.getElementById('btn-sound');
    const btnVibrate = document.getElementById('btn-vibrate');
    btnSound.onclick = (e) => {
      e.stopPropagation();
      isSoundOn = !isSoundOn;
      btnSound.classList.toggle('active', isSoundOn);
    };
    btnVibrate.onclick = (e) => {
      e.stopPropagation();
      isVibrationOn = !isVibrationOn;
      btnVibrate.classList.toggle('active', isVibrationOn);
    };

    const modalAuto = document.getElementById('modal-auto');
    const btnAutoModal = document.getElementById('btn-auto-modal');
    btnAutoModal.onclick = (e) => {
      e.stopPropagation();
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        btnAutoModal.style.background = 'var(--accent-subtle)';
        btnAutoModal.style.color = 'var(--accent-neon)';
        return;
      }
      modalAuto.classList.add('open');
    };
    document.getElementById('btn-cancel-auto').onclick = (e) => { e.stopPropagation(); modalAuto.classList.remove('open'); };

    const tabTouch = document.getElementById('tab-touch');
    const tabTimer = document.getElementById('tab-timer');
    const paneTouch = document.getElementById('pane-touch');
    const paneTimer = document.getElementById('pane-timer');
    tabTouch.onclick = (e) => {
      e.stopPropagation();
      tabTouch.classList.add('active');
      tabTimer.classList.remove('active');
      paneTouch.style.display = 'block';
      paneTimer.style.display = 'none';
    };
    tabTimer.onclick = (e) => {
      e.stopPropagation();
      tabTimer.classList.add('active');
      tabTouch.classList.remove('active');
      paneTimer.style.display = 'block';
      paneTouch.style.display = 'none';
    };

    let taps = [];
    const touchRing = document.getElementById('touch-calibrate-circle');
    touchRing.onclick = (e) => {
      e.stopPropagation();
      taps.push(Date.now());
      touchRing.textContent = taps.length;
      if (taps.length === 3) {
        const d1 = taps[1] - taps[0];
        const d2 = taps[2] - taps[1];
        const avg = ((d1 + d2) / 2) / 1000;
        autoDelay = Math.max(0.2, parseFloat(avg.toFixed(1)));
        document.getElementById('step-number').textContent = autoDelay.toFixed(1);
        taps = [];
        touchRing.textContent = '0';
        tabTimer.click();
      }
    };

    function changeStep(val) {
      autoDelay = Math.max(0.2, parseFloat((autoDelay + val).toFixed(1)));
      document.getElementById('step-number').textContent = autoDelay.toFixed(1);
    }
    document.getElementById('step-minus').onclick = (e) => { e.stopPropagation(); changeStep(-0.1); };
    document.getElementById('step-plus').onclick = (e) => { e.stopPropagation(); changeStep(0.1); };
    document.getElementById('step-minus-2').onclick = (e) => { e.stopPropagation(); changeStep(-1.0); };
    document.getElementById('step-plus-2').onclick = (e) => { e.stopPropagation(); changeStep(1.0); };

    document.getElementById('btn-start-auto').onclick = (e) => {
      e.stopPropagation();
      modalAuto.classList.remove('open');
      btnAutoModal.style.background = 'var(--accent-neon)';
      btnAutoModal.style.color = '#000';
      startTimerIfNotRunning();
      autoTimer = setInterval(incrementCount, autoDelay * 1000);
    };

    const presets = [
      { name: "SubhanAllah", ar: "سُبْحَانَ ٱللَّٰهِ", target: 33 },
      { name: "Alhamdulillah", ar: "ٱلْحَمْدُ لِلَّٰهِ", target: 33 },
      { name: "Allahu Akbar", ar: "ٱللَّٰهُ أَكْبَرُ", target: 34 },
      { name: "Astaghfirullah", ar: "أَسْتَغْفِرُ ٱللَّٰهَ", target: 100 },
      { name: "Darood Sharif", ar: "صَلَّىٰ ٱللَّٰهُ عَلَيْهِ", target: 100 }
    ];

    const presetsContainer = document.getElementById('presets-container');
    presets.forEach(p => {
      const item = document.createElement('div');
      item.className = 'preset-item';
      item.innerHTML = `<div><div style="font-weight:700;">${p.name}</div><small style="color:var(--text-muted);">Target: ${p.target}</small></div><div class="preset-arabic">${p.ar}</div>`;
      item.onclick = (e) => {
        e.stopPropagation();
        document.getElementById('tasbih-title').textContent = p.name;
        target = p.target;
        count = 0;
        renderCount();
        resetStopwatch();
        document.getElementById('modal-presets').classList.remove('open');
      };
      presetsContainer.appendChild(item);
    });

    document.getElementById('btn-open-presets').onclick = (e) => { e.stopPropagation(); document.getElementById('modal-presets').classList.add('open'); };
    document.getElementById('btn-close-presets').onclick = (e) => { e.stopPropagation(); document.getElementById('modal-presets').classList.remove('open'); };

    document.getElementById('btn-edit-title').onclick = (e) => {
      e.stopPropagation();
      const val = prompt("Tasbih nu naam lakho:", document.getElementById('tasbih-title').textContent);
      if (val && val.trim()) document.getElementById('tasbih-title').textContent = val.trim();
    };

    document.getElementById('btn-set-target').onclick = (e) => {
      e.stopPropagation();
      const val = prompt("Navo Target Limit set karo:", target);
      if (val && parseInt(val) > 0) {
        target = parseInt(val);
        renderCount();
      }
    };

    const themes = [
      { id: 'theme-emerald', color: '#25e26b', bg: '#0d382e' },
      { id: 'theme-amber', color: '#ffb703', bg: '#382c14' },
      { id: 'theme-ocean', color: '#00b4d8', bg: '#112d45' },
      { id: 'theme-ruby', color: '#ff3366', bg: '#3d141d' },
      { id: 'theme-purple', color: '#c77dff', bg: '#2c1442' },
      { id: 'theme-forest', color: '#4ade80', bg: '#11381b' },
      { id: 'theme-cyanteal', color: '#00f5d4', bg: '#0d383b' },
      { id: 'theme-rosegold', color: '#fb7185', bg: '#3d1e2e' }
    ];

    function renderThemesGrid() {
      const themesGrid = document.getElementById('themes-grid-container');
      themesGrid.innerHTML = '';
      themes.forEach((th) => {
        const box = document.createElement('div');
        box.className = 'theme-box';
        box.style.background = th.bg;
        box.innerHTML = `<div class="theme-box-circle" style="border-color: ${th.color}; -webkit-text-stroke-color: ${th.color}">30</div><div class="theme-box-notch" style="background: ${th.color};"></div>`;
        box.onclick = (e) => {
          e.stopPropagation();
          currentTheme = th.id;
          document.body.className = th.id;
          document.getElementById('sheet-themes').classList.remove('open');
        };
        themesGrid.appendChild(box);
      });
    }

    document.getElementById('btn-themes').onclick = (e) => {
      e.stopPropagation();
      renderThemesGrid();
      document.getElementById('sheet-themes').classList.add('open');
    };
    document.getElementById('btn-close-themes').onclick = (e) => { e.stopPropagation(); document.getElementById('sheet-themes').classList.remove('open'); };

    function logHistory() {
      if (count <= 0) return;
      historyLogs.unshift({
        title: document.getElementById('tasbih-title').textContent,
        count: count,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
    }

    document.getElementById('btn-history').onclick = (e) => {
      e.stopPropagation();
      const container = document.getElementById('history-container');
      container.innerHTML = '';
      if (historyLogs.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Haji koi record nathi</div>';
      } else {
        historyLogs.forEach(h => {
          const row = document.createElement('div');
          row.style.cssText = 'background:rgba(255,255,255,0.05); padding:10px 14px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;';
          row.innerHTML = `<div><div style="font-weight:700;">${h.title}</div><small style="color:var(--text-muted);">${h.time}</small></div><div style="font-size:22px; font-weight:700; color:var(--accent-neon);">${h.count}</div>`;
          container.appendChild(row);
        });
      }
      document.getElementById('sheet-history').classList.add('open');
    };
    document.getElementById('btn-close-history').onclick = (e) => { e.stopPropagation(); document.getElementById('sheet-history').classList.remove('open'); };
    document.getElementById('btn-clear-history').onclick = (e) => {
      e.stopPropagation();
      historyLogs = [];
      document.getElementById('btn-history').click();
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'VolumeUp') { e.preventDefault(); incrementCount(); }
      else if (e.key === 'ArrowDown' || e.key === 'VolumeDown') { e.preventDefault(); decrementCount(); }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Offline Ready (Service Worker Registered)'))
          .catch((err) => console.log('SW registration failed:', err));
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCount();
      renderThemesGrid();
    });
  </script>
</body>
</html>
